<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 일기장</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#3b3228;--sub:#8a7d6e;--line:#e8dfd0;--accent:#c0773a;--accent2:#f3e4d0}
@media (prefers-color-scheme:dark){:root{--bg:#1e1b18;--card:#2a2622;--ink:#efe6d9;--sub:#a09384;--line:#3b352e;--accent:#e09a5a;--accent2:#3a2f24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#c0392b}
header{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:1.3rem;flex:1}
main{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1100px;margin:20px auto;padding:0 16px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:.75rem;color:var(--sub)}
.cal .day{aspect-ratio:1;border:0;background:none;border-radius:8px;position:relative;padding:0}
.cal .day.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cal .day.today{outline:1px solid var(--accent)}
.cal .day.sel{background:var(--accent);color:#fff}
.cal .day.sel::after{background:#fff}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:12px 0 8px}
.list{max-height:320px;overflow:auto}
.item{padding:8px;border-radius:8px;cursor:pointer;border-bottom:1px dashed var(--line)}
.item:hover{background:var(--accent2)}
.item small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.row input[type=date],.row select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{width:100%;min-height:340px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;font-size:1.02rem}
.status{color:var(--sub);font-size:.85rem;margin-left:auto}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
.lock .card{text-align:center;width:300px}
.lock input{width:100%;padding:10px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:10px 0;font-size:1.2rem}
.lock .msg{min-height:1.5em;margin:6px 0;color:var(--sub)}
.lock .steps{font-size:.8rem;color:var(--sub);margin:0 0 6px}
.lock .fp{font-size:3rem;line-height:1.3}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px}
dialog .col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--accent2)}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;line-height:1}
#lb{padding:8px;max-width:96vw;background:#000;border:0}
#lb img{display:block;max-width:92vw;max-height:88vh;margin:auto}
body.locked>header,body.locked>main{visibility:hidden}
.hidden{display:none!important}
</style>
</head>
<body class="locked">

<div id="lock" class="lock">
  <div class="card">
    <h2>🔒 나의 일기장</h2>
    <p class="steps" id="steps"></p>
    <div id="step0" class="hidden">
      <p class="msg">처음이시네요. 일기장을 지킬 비밀번호를 정해 주세요.</p>
      <input id="newPw" type="password" autocomplete="new-password" maxlength="64" placeholder="새 비밀번호 (4자 이상)">
      <input id="newPw2" type="password" autocomplete="new-password" maxlength="64" placeholder="비밀번호 확인">
      <button class="primary" id="setupBtn">설정하고 시작</button>
      <button id="skipBtn">나중에</button>
    </div>
    <div id="step1">
      <input id="pin" type="password" autocomplete="off" maxlength="64" placeholder="비밀번호">
      <button class="primary" id="unlockBtn">다음</button>
    </div>
    <div id="step2" class="hidden">
      <div class="fp">👆</div>
      <button class="primary" id="fpVerifyBtn">지문 인증</button>
    </div>
    <p class="msg" id="lockMsg"></p>
  </div>
</div>

<dialog id="sec">
  <h3>🔑 보안 설정</h3>
  <div class="status" id="secState" style="margin:0"></div>
  <div class="col">
    <button id="pwBtn">비밀번호 설정/변경</button>
    <button id="fpBtn">지문 등록/해제</button>
    <button class="danger" id="offBtn">잠금 모두 해제</button>
    <button id="secClose">닫기</button>
  </div>
</dialog>

<header>
  <h1>📔 나의 일기장</h1>
  <button id="exportBtn">내보내기</button>
  <button id="importBtn">가져오기</button>
  <button id="pinBtn">🔑 보안</button>
  <input id="importFile" type="file" accept="application/json" class="hidden">
</header>

<main>
  <aside class="card">
    <div class="cal-head">
      <button id="prev">◀</button>
      <strong id="monthLabel"></strong>
      <button id="next">▶</button>
    </div>
    <div class="cal" id="cal"></div>
    <input class="search" id="search" placeholder="일기 검색 (제목·내용)">
    <div class="list" id="list"></div>
  </aside>

  <section class="card">
    <div class="row">
      <input type="date" id="date">
      <select id="mood">
        <option value="">기분</option>
        <option>😊</option><option>😄</option><option>😌</option><option>😐</option>
        <option>😢</option><option>😡</option><option>😴</option><option>🥰</option>
      </select>
      <select id="weather">
        <option value="">날씨</option>
        <option>☀️</option><option>⛅</option><option>☁️</option><option>🌧️</option>
        <option>⛈️</option><option>❄️</option><option>🌫️</option>
      </select>
    </div>
    <textarea id="body" placeholder="오늘은 어떤 하루였나요?"></textarea>
    <div class="row" style="margin:10px 0 0">
      <button id="photoBtn">📷 사진 추가</button>
      <span class="status" id="photoCount" style="margin-left:0"></span>
      <input id="photoFile" type="file" accept="image/*" multiple class="hidden">
    </div>
    <div class="photos" id="photos"></div>
    <div class="row" style="margin:10px 0 0">
      <button class="primary" id="saveBtn">저장</button>
      <button class="danger" id="delBtn">삭제</button>
      <span class="status" id="status"></span>
    </div>
  </section>
</main>

<dialog id="lb"><img id="lbImg" alt=""></dialog>

<script>
(() => {
  const KEY = 'diary.entries.v1';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = iso(new Date());

  // 저장소 (날짜 -> {title, body, mood, weather, updated})
  let entries = {};
  try { entries = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { entries = {}; }
  const persist = () => localStorage.setItem(KEY, JSON.stringify(entries));

  let selected = today, view = new Date();
  view.setDate(1);

  // ---------- 2단계 잠금 (비밀번호 → 지문) ----------
  const PW_KEY = 'diary.pw.v2', FP_KEY = 'diary.fp.v1';
  const enc = new TextEncoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const rand = n => crypto.getRandomValues(new Uint8Array(n));
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };

  async function pbkdf2(pw, salt) {
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 200000}, key, 256));
  }
  async function makePw(pw) {
    const salt = rand(16);
    return JSON.stringify({s: b64(salt), h: await pbkdf2(pw, salt)});
  }
  // 이전 버전(SHA-256 단일 해시)으로 저장된 비밀번호도 한 번 확인되면 새 방식으로 바꿔 저장
  async function legacyHash(s) {
    const buf = await crypto.subtle.digest('SHA-256', enc.encode('diary:' + s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function checkPw(pw) {
    const raw = get(PW_KEY);
    if (raw) { const {s, h} = JSON.parse(raw); return await pbkdf2(pw, unb64(s)) === h; }
    const old = get('diary.pin.v1');
    if (old && await legacyHash(pw) === old) {
      localStorage.setItem(PW_KEY, await makePw(pw)); localStorage.removeItem('diary.pin.v1'); return true;
    }
    return false;
  }
  const hasPw = () => !!(get(PW_KEY) || get('diary.pin.v1'));
  const hasFp = () => !!get(FP_KEY);

  async function fpSupported() {
    try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
    catch { return false; }
  }
  async function registerFp() {
    const cred = await navigator.credentials.create({publicKey: {
      challenge: rand(32),
      rp: {name: '나의 일기장'},
      user: {id: rand(16), name: 'diary', displayName: '일기장'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'},
      timeout: 60000
    }});
    localStorage.setItem(FP_KEY, b64(cred.rawId));
  }
  async function verifyFp() {
    await navigator.credentials.get({publicKey: {
      challenge: rand(32),
      allowCredentials: [{type: 'public-key', id: unb64(get(FP_KEY)), transports: ['internal']}],
      userVerification: 'required',
      timeout: 60000
    }});
  }

  const unlock = () => { $('lock').classList.add('hidden'); document.body.classList.remove('locked'); };
  const skipped = () => get('diary.nolock') === '1';
  function showLock() {
    $('step0').classList.add('hidden'); $('step1').classList.remove('hidden'); $('step2').classList.add('hidden');
    if (!hasPw()) {
      if (skipped()) return unlock();
      $('step1').classList.add('hidden'); $('step0').classList.remove('hidden');
      $('steps').textContent = '보안 설정'; $('lockMsg').textContent = ''; $('newPw').focus();
      return;
    }
    $('steps').textContent = hasFp() ? '1단계 / 2단계 · 비밀번호' : '비밀번호를 입력하세요';
    $('lockMsg').textContent = ''; $('pin').value = ''; $('pin').focus();
  }
  async function stepPassword() {
    if (!await checkPw($('pin').value)) { $('lockMsg').textContent = '비밀번호가 틀렸어요'; $('pin').value = ''; return; }
    if (!hasFp()) return unlock();
    $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
    $('steps').textContent = '2단계 / 2단계 · 지문 인증';
    stepFingerprint();
  }
  async function stepFingerprint() {
    $('lockMsg').textContent = '지문을 인식해 주세요';
    try { await verifyFp(); unlock(); }
    catch { $('lockMsg').textContent = '지문 인증에 실패했어요. 다시 시도해 주세요'; }
  }
  $('unlockBtn').onclick = stepPassword;
  $('pin').onkeydown = e => e.key === 'Enter' && stepPassword();
  $('fpVerifyBtn').onclick = stepFingerprint;
  $('setupBtn').onclick = async () => {
    const a = $('newPw').value;
    if (a.length < 4) { $('lockMsg').textContent = '4자 이상으로 입력해 주세요'; return; }
    if (a !== $('newPw2').value) { $('lockMsg').textContent = '비밀번호가 서로 달라요'; return; }
    localStorage.setItem(PW_KEY, await makePw(a)); localStorage.removeItem('diary.nolock'); $('newPw').value = $('newPw2').value = '';
    unlock();
  };
  $('skipBtn').onclick = () => { localStorage.setItem('diary.nolock', '1'); unlock(); };
  showLock();

  // ---------- 보안 설정 ----------
  function secState() {
    $('secState').textContent = `비밀번호: ${hasPw() ? '설정됨' : '없음'} · 지문: ${hasFp() ? '등록됨' : '없음'}`;
  }
  async function confirmCurrentPw() {
    if (!hasPw()) return true;
    const cur = prompt('현재 비밀번호를 입력하세요');
    if (cur === null) return false;
    if (await checkPw(cur)) return true;
    alert('비밀번호가 틀렸어요.'); return false;
  }
  $('pinBtn').onclick = () => { secState(); $('sec').showModal(); };
  $('secClose').onclick = () => $('sec').close();

  $('pwBtn').onclick = async () => {
    if (!await confirmCurrentPw()) return;
    const a = prompt('새 비밀번호를 입력하세요 (4자 이상)');
    if (a === null) return;
    if (a.length < 4) return alert('4자 이상으로 입력해 주세요.');
    if (prompt('한 번 더 입력하세요') !== a) return alert('비밀번호가 서로 달라요.');
    localStorage.setItem(PW_KEY, await makePw(a)); localStorage.removeItem('diary.pin.v1'); localStorage.removeItem('diary.nolock');
    secState(); alert('비밀번호를 설정했어요. 다음 접속부터 적용됩니다.');
  };

  $('fpBtn').onclick = async () => {
    if (!hasPw()) return alert('지문은 비밀번호와 함께 쓰는 2단계 인증이에요. 먼저 비밀번호를 설정해 주세요.');
    if (hasFp()) {
      if (!await confirmCurrentPw() || !confirm('지문 인증을 해제할까요?')) return;
      localStorage.removeItem(FP_KEY); secState(); return;
    }
    if (!await fpSupported()) return alert('이 기기나 브라우저에서는 지문(화면 잠금) 인증을 쓸 수 없어요.');
    try { await registerFp(); secState(); alert('지문을 등록했어요. 다음 접속부터 비밀번호 → 지문 순서로 확인합니다.'); }
    catch { alert('지문 등록이 취소되었거나 실패했어요.'); }
  };

  $('offBtn').onclick = async () => {
    if (!hasPw()) return alert('설정된 잠금이 없어요.');
    if (!await confirmCurrentPw() || !confirm('비밀번호와 지문 잠금을 모두 해제할까요?')) return;
    ['diary.pin.v1', PW_KEY, FP_KEY].forEach(k => localStorage.removeItem(k)); localStorage.setItem('diary.nolock', '1'); secState();
  };

  // ---------- 달력 ----------
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth();
    $('monthLabel').textContent = `${y}년 ${m+1}월`;
    let html = ['일','월','화','수','목','금','토'].map(d => `<div class="dow">${d}</div>`).join('');
    const first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
    for (let i = 0; i < first; i++) html += '<div></div>';
    for (let d = 1; d <= last; d++) {
      const k = `${y}-${pad(m+1)}-${pad(d)}`;
      const cls = ['day', entries[k] ? 'has' : '', k === today ? 'today' : '', k === selected ? 'sel' : ''].join(' ');
      html += `<button class="${cls}" data-d="${k}">${d}</button>`;
    }
    $('cal').innerHTML = html;
  }
  $('cal').onclick = e => { const k = e.target.dataset.d; if (k) select(k); };
  $('prev').onclick = () => { view.setMonth(view.getMonth()-1); renderCal(); };
  $('next').onclick = () => { view.setMonth(view.getMonth()+1); renderCal(); };

  // ---------- 목록 / 검색 ----------
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const keys = Object.keys(entries).sort().reverse().filter(k => {
      const e = entries[k];
      return !q || ((e.title || '') + ' ' + e.body).toLowerCase().includes(q);
    });
    $('list').innerHTML = keys.length ? keys.map(k => {
      const e = entries[k];
      return `<div class="item" data-d="${k}"><small>${k} ${e.mood||''}${e.weather||''}${(e.photos||[]).length ? ' 📷' + e.photos.length : ''}</small><br>` +
             `<b>${esc(e.title || e.body.trim().split('\n')[0].slice(0, 30) || '(내용 없음)')}</b><br><small>${esc(e.body.slice(0, 40))}</small></div>`;
    }).join('') : '<p style="color:var(--sub)">일기가 없어요.</p>';
  }
  $('list').onclick = e => { const it = e.target.closest('.item'); if (it) select(it.dataset.d, true); };
  $('search').oninput = renderList;

  let timer = null;
  // ---------- 사진 (IndexedDB, 일기마다 복사본 보관) ----------
  const MAX_PHOTOS = 10, MAX_SIDE = 1280;
  const dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('diary-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath: 'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function tx(mode, fn) {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode); let out;
      const rq = fn(t.objectStore('photos'));
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
    });
  }
  const putPhoto = p => tx('readwrite', s => s.put(p));
  const getPhoto = id => tx('readonly', s => s.get(id));
  const delPhoto = id => tx('readwrite', s => s.delete(id)).catch(() => {});
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

  async function shrink(file) {
    let src, url;
    try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
    catch {
      url = URL.createObjectURL(file);
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    }
    const w = src.width, h = src.height, r = Math.min(1, MAX_SIDE / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close(); if (url) URL.revokeObjectURL(url);
    return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.82));
  }

  // 사진 목록을 일기(entries[day].photos)에 반영
  function setPhotos(day, ids) {
    const e = entries[day] || (entries[day] = {title: '', body: '', mood: '', weather: ''});
    e.photos = ids; e.updated = Date.now();
    if (!e.body.trim() && !e.title && !ids.length) delete entries[day];
    persist(); renderCal(); renderList();
    if (day === selected) renderPhotos();
  }

  let thumbUrls = [], photoSeq = 0;
  async function renderPhotos() {
    const seq = ++photoSeq, day = selected, ids = (entries[day] || {}).photos || [];
    $('photoCount').textContent = ids.length ? `${ids.length}/${MAX_PHOTOS}` : '';
    const rows = await Promise.all(ids.map(id => getPhoto(id).catch(() => null)));
    if (seq !== photoSeq) return;
    thumbUrls.forEach(u => URL.revokeObjectURL(u)); thumbUrls = [];
    $('photos').innerHTML = '';
    rows.forEach((row, i) => {
      if (!row) return;
      const u = URL.createObjectURL(row.blob); thumbUrls.push(u);
      const d = document.createElement('div'); d.className = 'ph';
      const img = document.createElement('img'); img.src = u; img.alt = '사진'; img.onclick = () => { $('lbImg').src = u; $('lb').showModal(); };
      const x = document.createElement('button'); x.textContent = '×'; x.title = '사진 삭제';
      x.onclick = async () => {
        if (!confirm('이 사진을 일기장에서 삭제할까요? (갤러리 원본은 지워지지 않아요)')) return;
        await delPhoto(ids[i]); setPhotos(day, ((entries[day] || {}).photos || []).filter(v => v !== ids[i]));
      };
      d.append(img, x); $('photos').append(d);
    });
  }
  $('lb').onclick = () => $('lb').close();

  $('photoBtn').onclick = () => $('photoFile').click();
  $('photoFile').onchange = async ev => {
    const files = [...ev.target.files]; ev.target.value = '';
    if (!files.length) return;
    const day = selected, cur = (entries[day] || {}).photos || [];
    const room = MAX_PHOTOS - cur.length;
    if (room <= 0) return alert(`사진은 한 일기에 최대 ${MAX_PHOTOS}장까지 넣을 수 있어요.`);
    const take = files.slice(0, room);
    if (files.length > room) alert(`최대 ${MAX_PHOTOS}장까지라서 ${take.length}장만 추가할게요.`);
    $('status').textContent = '사진 처리 중...';
    const added = [];
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      for (const f of take) {
        const blob = await shrink(f), id = newId();
        await putPhoto({id, blob, day, created: Date.now()}); added.push(id);
      }
    } catch { alert('사진을 저장하지 못했어요. 저장 공간이 부족하거나 지원하지 않는 사진일 수 있어요.'); }
    if (added.length) setPhotos(day, [...((entries[day] || {}).photos || []), ...added]);
    if (day === selected) $('status').textContent = added.length ? `사진 ${added.length}장 추가됨` : '';
  };

  // ---------- 편집 ----------
  function load() {
    const e = entries[selected] || {};
    $('date').value = selected;
    $('body').value = e.body || '';
    $('mood').value = e.mood || '';
    $('weather').value = e.weather || '';
    $('status').textContent = e.updated ? `마지막 저장: ${new Date(e.updated).toLocaleString('ko-KR')}` : '새 일기';
    renderPhotos();
  }
  function select(k, jump) {
    if (timer) { clearTimeout(timer); timer = null; save(true); }
    selected = k;
    if (jump) { view = new Date(k + 'T00:00'); view.setDate(1); }
    load(); renderCal();
  }
  $('date').onchange = () => $('date').value && select($('date').value, true);

  function save(auto) {
    const old = entries[selected] || {};
    const e = { title: old.title || '', body: $('body').value, mood: $('mood').value, weather: $('weather').value, photos: old.photos || [] };
    if (!e.body.trim() && !e.photos.length) { if (!auto) alert('내용을 입력해 주세요.'); return; }
    e.updated = Date.now();
    entries[selected] = e; persist();
    $('status').textContent = (auto ? '자동 저장됨 ' : '저장됨 ') + new Date().toLocaleTimeString('ko-KR');
    renderCal(); renderList();
  }
  $('saveBtn').onclick = () => save(false);
  $('delBtn').onclick = () => {
    if (!entries[selected]) return load();
    if (!confirm(`${selected} 일기를 삭제할까요?`)) return;
    ((entries[selected] || {}).photos || []).forEach(delPhoto);
    delete entries[selected]; persist(); load(); renderCal(); renderList();
  };
  ['body','mood','weather'].forEach(id => $(id).addEventListener('input', () => {
    clearTimeout(timer); timer = setTimeout(() => { timer = null; save(true); }, 1500);
  }));
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(false); } });

  // ---------- 백업 (사진 포함) ----------
  const toDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  $('exportBtn').onclick = async () => {
    $('status').textContent = '백업 파일 만드는 중...';
    try {
      const photos = [];
      for (const day of Object.keys(entries)) {
        for (const id of entries[day].photos || []) {
          const row = await getPhoto(id).catch(() => null);
          if (row) photos.push({id, day, data: await toDataUrl(row.blob)});
        }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({version: 2, entries, photos})], {type: 'application/json'}));
      a.download = `diary-backup-${today}.json`; a.click(); URL.revokeObjectURL(a.href);
      $('status').textContent = `백업 완료 (일기 ${Object.keys(entries).length}개, 사진 ${photos.length}장)`;
    } catch { $('status').textContent = ''; alert('백업 파일을 만들지 못했어요.'); }
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (typeof data !== 'object' || data === null || Array.isArray(data)) throw 0;
      const v2 = data.version === 2 && data.entries;
      const inEntries = v2 ? data.entries : data, inPhotos = v2 ? (data.photos || []) : [];
      const n = Object.keys(inEntries).length;
      if (!confirm(`일기 ${n}개${inPhotos.length ? `, 사진 ${inPhotos.length}장` : ''}을 가져옵니다. 같은 날짜는 덮어씁니다. 계속할까요?`)) return;
      const keep = new Set(inPhotos.map(p => p.id));
      for (const day of Object.keys(inEntries)) for (const id of (entries[day] || {}).photos || []) if (!keep.has(id)) await delPhoto(id);
      for (const p of inPhotos) await putPhoto({id: p.id, blob: await (await fetch(p.data)).blob(), day: p.day, created: Date.now()});
      Object.assign(entries, inEntries); persist(); load(); renderCal(); renderList();
    } catch { alert('올바른 백업 파일이 아니에요.'); }
    ev.target.value = '';
  };

  load(); renderCal(); renderList();
})();
</script>
</body>
</html>
